  - search
  - macros:
      include_dir: *macros_tmpls
  - glightbox:
      skip_classes:
        - "no-lightbox"
  - git-revision-date-localized:
      enable_creation_date: !ENV [CI, false]
      fallback_to_build_date: true
  - git-committers:
      enabled: !ENV [CI, false]
      token: !ENV ["GH_TOKEN"]
      repository: !ENV GITHUB_REPOSITORY
      branch: !ENV GITHUB_REF_NAME
  - bazzite-social:
      # use_image_from_page: true # Use first image found in a page as fallback
  - tags:
      tags_file: tags.md

markdown_extensions:
  - attr_list
  - md_in_html
  - nl2br
  - mdx_better_lists
  - footnotes
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  #region Enable Admonitions
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  #endregion Enable Admonitions
  #region Enable Content Tabs
  - pymdownx.tabbed:
      alternate_style: true
  #endregion Enable Content Tabs

