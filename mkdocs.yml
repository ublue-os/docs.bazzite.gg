site_name: Bazzite Documentation
site_author: nicknamenamenick
site_url: !ENV MKDOCS_SITE_URL
repo_url: https://github.com/ublue-os/bazzite
repo_name: ublue-os/bazzite
edit_uri: https://github.com/KyleGospo/docs.bazzite.gg/blob/main/src
site_description: Bazzite is a custom image built upon Fedora Atomic Desktops that brings the best of Linux gaming to all of your devices.

watch:
  - theme_overrides
  - &macros_tmpls macros_tmpls

validation:
  links:
    not_found: warn
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/image_sizing.css
  - stylesheets/bazzite.css
theme:
  name: material
  custom_dir: theme_overrides
  palette:
    - media: "(prefers-color-scheme)"
      primary: deep purple
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  favicon: static/favicon.svg
  logo: static/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    # - navigation.instant # Incompatible with mkdocs_static_i18n
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - announce.dismiss
    - content.tabs.link

docs_dir: src
site_dir: book

hooks:
  - hooks/fail_on_hardcoded_url.py # This hook must be set before cmdrun.py, otherwise it will fail
  - hooks/cmdrun.py # 100-99
  - hooks/embed_youtube.py # 80
  - hooks/md_image_sizing.py

plugins:
  - privacy
  - i18n:
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: French
          build: true
        - locale: cs
          name: Čeština
          build: true
        - locale: ru
          name: Русский
          build: true
          site_name: Документация Bazzite
          theme:
            language: ru
          nav:
            - Главная: index.md
            - FAQ: "General/FAQ.md"
            - Установка:
                - "Установка Bazzite": General/Installation_Guide/index.md
                - "Руководство по установке": General/Installation_Guide/install-guide.md
                - "Настройка после установки": General/Installation_Guide/post-installation.md
                - "Устранение проблем с установкой": General/Installation_Guide/troubleshoot_guide.md
                - "Руководство по старому ISO-установщику": General/Installation_Guide/legacy-install.md
                - "Альтернативная установка": General/Installation_Guide/alternate-install-guide.md
            - Общее:
