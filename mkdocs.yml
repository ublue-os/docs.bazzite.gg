site_name: Bazzite Documentation
site_author: nicknamenamenick
site_url: !ENV MKDOCS_SITE_URL
repo_url: https://github.com/ublue-os/bazzite
repo_name: ublue-os/bazzite
edit_uri: https://github.com/KyleGospo/docs.bazzite.gg/blob/main/src
site_description: Bazzite is a custom image built upon Fedora Atomic Desktops that brings the best of Linux gaming to all of your devices.

watch:
  - theme_overrides
  - &macros_tmpls macros_tmpls

validation:
  links:
    not_found: warn
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/image_sizing.css
  - stylesheets/bazzite.css
theme:
  name: material
  custom_dir: theme_overrides
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      primary: deep purple
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  favicon: static/favicon.svg
  logo: static/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    # - navigation.instant # Incompatible with mkdocs_static_i18n
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - announce.dismiss
    - content.tabs.link

docs_dir: src
site_dir: book

hooks:
  - hooks/fail_on_hardcoded_url.py # This hook must be set before cmdrun.py, otherwise it will fail
  - hooks/cmdrun.py # 100-99
  - hooks/embed_youtube.py # 80
  - hooks/md_image_sizing.py
  - hooks/localized_search_split.py

plugins:
  - privacy
  - i18n:
      languages:
        # The theme: language key is required for every locale even if it doesn't require an alias (like zh_CN -> zh).
        # Having it on one locale but not the latter ones causes it to leak downwards (?),
        # which kills the build for later locales due to template mismatch.
        # I have zero idea why and at this point I am too afraid to ask.
        - locale: fr
          name: French
          build: true
          theme:
            language: fr
        - locale: cs
          name: Čeština
          build: true
          theme:
            language: cs
        - locale: uk
          name: Українська
